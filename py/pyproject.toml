[project]
name = "intgrad"
version = "0.1.0"
description = "Byte-level toy LLM with byte numerics (reference engine + data pipeline)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "torch>=2.9",
]

[project.optional-dependencies]
corpus = ["lxml>=5.0", "zstandard>=0.23"]

[project.scripts]
ig-build-shards = "intgrad.corpus.build_shards:main"
ig-make-split = "intgrad.corpus.make_split:main"
ig-eval-freeze = "intgrad.eval_set:main"
ig-train = "intgrad.train:main"
ig-position = "intgrad.position:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intgrad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
