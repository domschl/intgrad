# M3 scaling ladder: fixed byte budget per preset (set model.preset, train.batch, train.steps)
name = "m3-ladder"

[model]
kind = "transformer"

[quant]
enabled = false

[train]
warmup = 300
lr = 3e-3
wd = 3.0
betas = [0.95, 0.98]
log_every = 200
telemetry_every = 2000
eval_every = 2000
samples = 32
sample_len = 1024
