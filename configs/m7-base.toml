# M7 base: flat L, tuned (plan/001 X31/X32). 300 MB = 9,155 steps x 32 kB.
# eval-v1 1.487 (m7-flatL-lr7.5e-4-wu1k); hourglass (M6) shelved, X30.
name = "m7-base"

[model]
kind = "transformer"
preset = "L"
qkv_conv = 3

[quant]
enabled = false

[train]
steps = 9155
batch = 32
micro_batch = 16          # 6.25 GiB; the math is that of batch 32
lr = 7.5e-4               # X31: 3e-3 1.536, 1.5e-3 1.525, 1e-3 1.501, 7.5e-4 1.494, 5e-4 1.491
wd = 3.0                  # Lion: decay per step is lr*wd; wd 1.5 at 7.5e-4 hurts (X32)
warmup = 1000             # X32: -0.007 at lr 7.5e-4
betas = [0.95, 0.98]
compile = true
log_every = 200
telemetry_every = 2000
eval_every = 2000
samples = 32
sample_len = 1024
